spring:
  application:
    name: kaka-api
  main:
    banner-mode: OFF
  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-stacktrace: never
  datasource:
    url: ${NAIS_DATABASE_KAKA_API_PRIV_KAKA_API_JDBC_URL}
  flyway:
    enabled: true
    clean-disabled: true
    schemas: flyway_history_schema,kaka
  jpa:
    open-in-view: false
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    format:
      date: yyyy-MM-dd

server:
  port: 7070
  error:
    whitelabel:
      enabled: false
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 5KB

management:
  endpoint:
    health:
      show-details: never
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
#
#logging:
#  level:
#    root: debug

kabalApiName: ${NAIS_CLUSTER_NAME}:${NAIS_NAMESPACE}:${KABAL_API_APP_NAME}

KABAL_API_APP_NAME: "kabal-api"

KLAGE_LOOKUP_APP_NAME: klage-lookup
KLAGE_LOOKUP_BASE_URL: http://klage-lookup
